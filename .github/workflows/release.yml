name: Release Distribution
on:
  workflow_dispatch:
jobs:
  release_github:
    name: Release on github
    runs-on: ubuntu-latest
    permissions: write-all
    defaults:
      run:
        working-directory: bad-proxy-core
        shell: bash
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: bad-proxy-core
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version-file: bad-proxy-core/go.mod
      - name: Build
        run: |
          chmod +x ./build.sh
          ./build.sh ${{ vars.DIST_NAME }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          files: dist/*
      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'bad-proxy-core/dist/**/*.tar.gz, bad-proxy-core/dist/**/*.zip'
  release_dockerhub:
    name: Release on dockerhub
    runs-on: ubuntu-latest
    needs: release_github
    permissions: write-all
    steps:
      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push tag
        uses: docker/build-push-action@v6
        with:
          push: true
          sbom: true
          provenance: mode=max
          tags: wwricu/bad-proxy-core:${{ github.ref_name }}, wwricu/bad-proxy-core:latest
