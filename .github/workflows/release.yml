name: Publish release
on:
  push:
    branches:
      - release
  workflow_dispatch:
jobs:
  release_github:
    runs-on: ubuntu-latest
    # least privilege: release write + build attestation, nothing else
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.readver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: readver
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - run: |
          chmod +x ./build.sh
          ./build.sh ${{ vars.DIST_NAME }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.readver.outputs.version }}
          files: dist/*
          # without this the tag is cut from the repository default branch, so
          # the release points at stale source while the assets hold this build
          target_commitish: ${{ github.sha }}
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/**/*.tar.gz, dist/**/*.zip'
  release_dockerhub:
    runs-on: ubuntu-latest
    needs: release_github
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          # tag with the real version from version.txt, not the branch name
          tags: wwricu/bad-proxy-core:${{ needs.release_github.outputs.version }}, wwricu/bad-proxy-core:latest
