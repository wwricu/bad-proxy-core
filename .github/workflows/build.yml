name: Build Artifact
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - run: |
          chmod +x ./build.sh
          ./build.sh ${{ vars.DIST_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: bad-proxy-core
          path: dist
          overwrite: true
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/**/*.tar.gz, dist/**/*.zip'
